<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lora:wght@400;500;600&display=swap">
  <style id="__om-edit-overrides"></style>
  <script src="./doc-page.js"></script>
  <script src="./image-slot.js"></script>
</helmet>
<style>doc-page:not(:defined){visibility:hidden}</style>
<doc-page width="210mm" height="297mm">
<section class="page" style="--rose:#B5697A;--rose-deep:#8C4A5B;--ink:#332A2C;--ivory:#FDFBF7;--rule:#E4D6D9;">
  <div style="position:relative;width:100%;height:100%;padding:14mm;box-sizing:border-box;background:var(--ivory);font-family:'Lora',serif;color:var(--ink);overflow:hidden;">

    <svg viewBox="0 0 120 120" style="position:absolute;top:14mm;left:14mm;width:34mm;height:34mm;opacity:0.9;">
      <path d="M4 4 C 30 6, 40 20, 38 40 C 50 30, 66 34, 70 50" fill="none" stroke="{{ colors.rose }}" stroke-width="1.4" stroke-linecap="round"/>
      <ellipse cx="40" cy="20" rx="7" ry="3.4" transform="rotate(35 40 20)" fill="{{ colors.rose }}" opacity="0.75"/>
      <ellipse cx="52" cy="34" rx="6" ry="3" transform="rotate(-15 52 34)" fill="{{ colors.rose }}" opacity="0.6"/>
      <ellipse cx="62" cy="46" rx="5.5" ry="2.8" transform="rotate(30 62 46)" fill="{{ colors.roseDeep }}" opacity="0.65"/>
      <circle cx="16" cy="10" r="2" fill="{{ colors.roseDeep }}"/>
      <circle cx="26" cy="6" r="1.4" fill="{{ colors.rose }}"/>
    </svg>
    <svg viewBox="0 0 120 120" style="position:absolute;bottom:14mm;right:14mm;width:34mm;height:34mm;opacity:0.9;transform:scale(-1,-1);">
      <path d="M4 4 C 30 6, 40 20, 38 40 C 50 30, 66 34, 70 50" fill="none" stroke="{{ colors.rose }}" stroke-width="1.4" stroke-linecap="round"/>
      <ellipse cx="40" cy="20" rx="7" ry="3.4" transform="rotate(35 40 20)" fill="{{ colors.rose }}" opacity="0.75"/>
      <ellipse cx="52" cy="34" rx="6" ry="3" transform="rotate(-15 52 34)" fill="{{ colors.rose }}" opacity="0.6"/>
      <ellipse cx="62" cy="46" rx="5.5" ry="2.8" transform="rotate(30 62 46)" fill="{{ colors.roseDeep }}" opacity="0.65"/>
      <circle cx="16" cy="10" r="2" fill="{{ colors.roseDeep }}"/>
      <circle cx="26" cy="6" r="1.4" fill="{{ colors.rose }}"/>
    </svg>

    <div style="position:relative;height:100%;display:flex;flex-direction:column;gap:4mm;">
      <sc-if value="{{ invocation }}" hint-placeholder-val="{{ true }}">
        <div style="text-align:center;font-size:11.5pt;font-style:italic;color:var(--rose-deep);">{{ invocation }}</div>
      </sc-if>

      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:7mm;padding-bottom:3.5mm;border-bottom:1pt solid var(--rule);">
        <div style="flex:1;min-width:0;padding-top:2mm;">
          <div style="font-family:'Playfair Display',serif;font-size:31pt;font-weight:700;color:var(--rose-deep);line-height:1.15;">{{ name }}</div>
        </div>
        <sc-if value="{{ showPhoto }}" hint-placeholder-val="{{ true }}">
          <div style="flex:none;width:32mm;height:42.6mm;border-radius:16mm 16mm 2mm 2mm;overflow:hidden;border:1.4pt solid var(--rose);box-sizing:border-box;">
            <image-slot id="t3-photo" shape="rect" placeholder="Portrait photo, 3:4" style="width:100%;height:100%;"></image-slot>
          </div>
        </sc-if>
      </div>

      <div style="flex:1;display:flex;flex-direction:column;gap:3.5mm;overflow:hidden;">
        <sc-for list="{{ sections }}" as="section" hint-placeholder-count="5">
          <div style="break-inside:avoid;">
            <div style="font-family:'Playfair Display',serif;font-size:12pt;font-weight:600;letter-spacing:0.06em;color:var(--rose-deep);padding-bottom:1.3mm;border-bottom:0.75pt solid var(--rule);">{{ section.title }}</div>
            <div style="display:grid;grid-template-columns:max-content 1fr max-content 1fr;column-gap:5mm;row-gap:1.6mm;padding-top:2mm;">
              <sc-for list="{{ section.fields }}" as="f" hint-placeholder-count="4">
                <div style="font-size:10pt;font-weight:600;color:var(--rose-deep);white-space:nowrap;">{{ f.l }}</div>
                <div style="font-size:10pt;color:var(--ink);">{{ f.v }}</div>
              </sc-for>
            </div>
          </div>
        </sc-for>
      </div>

      <div style="text-align:center;font-size:8.5pt;font-style:italic;color:var(--rose);border-top:0.5pt solid var(--rule);padding-top:2mm;">Prepared with care, on the occasion of a new beginning</div>
    </div>
  </div>
</section>
<sc-if value="{{ hasExtraPhotos }}" hint-placeholder-val="{{ false }}">
<section class="page" style="--rose:#B5697A;--rose-deep:#8C4A5B;--ivory:#FDFBF7;--rule:#E4D6D9;">
  <div style="position:relative;width:100%;height:100%;padding:14mm;box-sizing:border-box;background:var(--ivory);font-family:'Lora',serif;display:flex;flex-direction:column;gap:6mm;align-items:center;">
    <div style="font-family:'Playfair Display',serif;font-size:16pt;font-weight:600;color:var(--rose-deep);border-bottom:0.75pt solid var(--rule);padding-bottom:2.5mm;">Photographs</div>
    <div style="flex:1;width:100%;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:6mm;">
      <sc-for list="{{ extraPhotos }}" as="p" hint-placeholder-count="4">
        <div style="width:{{ tileWidthMm }}mm;aspect-ratio:3/4;border-radius:6mm 6mm 2mm 2mm;overflow:hidden;border:1.2pt solid var(--rose);box-sizing:border-box;">
          <image-slot id="{{ p.id }}" shape="rect" placeholder="Photo" style="width:100%;height:100%;"></image-slot>
        </div>
      </sc-for>
    </div>
  </div>
</section>
</sc-if>
</doc-page>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: {&quot;width&quot;: 794, &quot;height&quot;: 1123},
  &quot;showPhoto&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Content&quot;},
  &quot;photoCount&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 1, &quot;min&quot;: 1, &quot;max&quot;: 5, &quot;step&quot;: 1, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Content&quot;},
  &quot;density&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;full&quot;, &quot;options&quot;: [&quot;full&quot;, &quot;minimal&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Content&quot;},
  &quot;invocation&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;With gratitude to family and blessings of elders&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Content&quot;}
}">
class Component extends DCLogic {
  data = [
    {title:'Personal Details', fields:[
      {l:'Full Name', v:'Ananya Raghunathan', e:true},
      {l:'Date of Birth', v:'14 June 1996', e:true},
      {l:'Time of Birth', v:'06:45 AM', e:false},
      {l:'Place of Birth', v:'Coimbatore, Tamil Nadu', e:false},
      {l:'Height', v:'5 ft 5 in (165 cm)', e:true},
      {l:'Weight', v:'58 kg', e:false},
      {l:'Complexion', v:'Fair', e:false},
      {l:'Blood Group', v:'B+', e:false},
      {l:'Marital Status', v:'Never Married', e:false},
      {l:'Diet', v:'Vegetarian', e:false},
      {l:'Habits', v:'Non-smoker, non-drinker', e:false},
      {l:'Languages Known', v:'Tamil, English, Hindi', e:false},
      {l:'Hobbies', v:'Classical dance, reading, gardening', e:false},
    ]},
    {title:'Religious & Astrological', fields:[
      {l:'Religion', v:'Hindu', e:true},
      {l:'Caste', v:'Iyer', e:false},
      {l:'Gotra', v:'Bharadwaja', e:false},
      {l:'Rashi (Moon Sign)', v:'Kanya (Virgo)', e:false},
      {l:'Nakshatra', v:'Chitra', e:false},
      {l:'Manglik Status', v:'Non-Manglik', e:false},
    ]},
    {title:'Education & Career', fields:[
      {l:'Highest Qualification', v:'M.Tech, Computer Science', e:true},
      {l:'College / University', v:'IIT Madras', e:false},
      {l:'Occupation', v:'Software Engineer', e:true},
      {l:'Company', v:'Infosys Ltd., Bengaluru', e:false},
      {l:'Annual Income', v:'\u20b918,00,000 per annum', e:false},
      {l:'Work Location', v:'Bengaluru, Karnataka', e:true},
    ]},
    {title:'Family Details', fields:[
      {l:"Father's Name", v:'Mr. R. Raghunathan', e:false},
      {l:"Father's Occupation", v:'Retired Bank Manager', e:false},
      {l:"Mother's Name", v:'Mrs. Kavitha Raghunathan', e:false},
      {l:"Mother's Occupation", v:'Homemaker', e:false},
      {l:'Siblings', v:'One elder brother (married), one younger sister (unmarried)', e:false},
      {l:'Family Type', v:'Nuclear Family', e:false},
      {l:'Native Place', v:'Thanjavur, Tamil Nadu', e:false},
    ]},
    {title:'Contact', fields:[
      {l:'Address', v:'12 Gandhi Street, R.S. Puram, Coimbatore 641002', e:false},
      {l:'Phone', v:'+91 98765 43210', e:true},
      {l:'Email', v:'ananya.r@example.com', e:false},
      {l:'Contact Person', v:'Mr. R. Raghunathan (Father)', e:false},
    ]},
  ];

  renderVals() {
    const density = this.props.density ?? 'full';
    const showPhoto = this.props.showPhoto ?? true;
    const invocation = this.props.invocation ?? 'With gratitude to family and blessings of elders';
    const sections = this.data
      .map(s => ({ title: s.title, fields: s.fields.filter(f => density === 'full' || f.e) }))
      .filter(s => s.fields.length > 0);
    const photoCount = Math.max(1, Math.min(5, this.props.photoCount ?? 1));
    const extraPhotos = Array.from({length: photoCount - 1}, (_, i) => ({id: 't3-extra-' + i}));
    const tileWidthMm = {1:100, 2:80, 3:55, 4:80}[extraPhotos.length] || 80;
    return {
      sections, showPhoto, invocation,
      extraPhotos, hasExtraPhotos: extraPhotos.length > 0, tileWidthMm,
      name: 'Ananya Raghunathan',
      colors: { rose: '#B5697A', roseDeep: '#8C4A5B' },
    };
  }
}
</script>
</body>
</html>
