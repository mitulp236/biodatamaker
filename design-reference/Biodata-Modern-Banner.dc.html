<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
  <style id="__om-edit-overrides"></style>
  <script src="./doc-page.js"></script>
  <script src="./image-slot.js"></script>
</helmet>
<style>doc-page:not(:defined){visibility:hidden}</style>
<doc-page width="210mm" height="297mm">
<section class="page" style="--slate:#3B5169;--ink:#1A1A1A;--muted:#6E7076;--bg:#F7F7F5;--rule:#D9DBDD;">
  <div style="position:relative;width:100%;height:100%;padding:14mm;box-sizing:border-box;background:var(--bg);font-family:'Space Grotesk',sans-serif;color:var(--ink);display:flex;flex-direction:column;gap:5mm;">

    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:5mm;padding-bottom:4mm;border-bottom:1.5pt solid var(--slate);">
      <div>
        <div style="font-size:27pt;font-weight:700;line-height:1.1;">{{ name }}</div>
        <sc-if value="{{ invocation }}" hint-placeholder-val="{{ true }}">
          <div style="font-size:10pt;color:var(--muted);margin-top:1.5mm;">{{ invocation }}</div>
        </sc-if>
      </div>
      <div style="display:flex;gap:5mm;font-size:9.5pt;color:var(--muted);flex-shrink:0;">
        <sc-for list="{{ quickFacts }}" as="q" hint-placeholder-count="4">
          <div style="text-align:right;">
            <div style="letter-spacing:0.1em;text-transform:uppercase;font-size:8pt;color:var(--slate);">{{ q.l }}</div>
            <div style="color:var(--ink);font-weight:500;margin-top:0.6mm;">{{ q.v }}</div>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="flex:1;display:flex;align-items:flex-start;gap:8mm;overflow:hidden;">
      <sc-if value="{{ showPhoto }}" hint-placeholder-val="{{ true }}">
        <div style="flex:none;width:34mm;aspect-ratio:3/4;position:relative;">
          <svg viewBox="0 0 10 10" style="position:absolute;top:-1.5mm;left:-1.5mm;width:4mm;height:4mm;"><path d="M0 4 L0 0 L4 0" fill="none" stroke="{{ colors.slate }}" stroke-width="0.9"/></svg>
          <svg viewBox="0 0 10 10" style="position:absolute;bottom:-1.5mm;right:-1.5mm;width:4mm;height:4mm;"><path d="M10 6 L10 10 L6 10" fill="none" stroke="{{ colors.slate }}" stroke-width="0.9"/></svg>
          <image-slot id="tb-photo" shape="rect" placeholder="Portrait photo, 3:4" style="width:100%;height:100%;"></image-slot>
        </div>
      </sc-if>
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4mm;overflow:hidden;">
        <sc-for list="{{ sections }}" as="section" hint-placeholder-count="5">
          <div style="break-inside:avoid;">
            <div style="font-size:10pt;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--slate);padding-bottom:1.3mm;border-bottom:0.75pt solid var(--rule);">{{ section.title }}</div>
            <div style="display:grid;grid-template-columns:max-content 1fr max-content 1fr;column-gap:5mm;row-gap:1.5mm;padding-top:2mm;">
              <sc-for list="{{ section.fields }}" as="f" hint-placeholder-count="4">
                <div style="font-size:10pt;color:var(--muted);white-space:nowrap;">{{ f.l }}</div>
                <div style="font-size:10pt;color:var(--ink);">{{ f.v }}</div>
              </sc-for>
            </div>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="text-align:center;font-size:8.5pt;color:var(--muted);border-top:0.5pt solid var(--rule);padding-top:2mm;">Prepared with care, on the occasion of a new beginning</div>
  </div>
</section>
<sc-if value="{{ hasExtraPhotos }}" hint-placeholder-val="{{ false }}">
<section class="page" style="--slate:#3B5169;--bg:#F7F7F5;--rule:#D9DBDD;">
  <div style="position:relative;width:100%;height:100%;padding:14mm;box-sizing:border-box;background:var(--bg);font-family:'Space Grotesk',sans-serif;display:flex;flex-direction:column;gap:6mm;align-items:center;">
    <div style="font-size:11pt;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--slate);border-bottom:0.75pt solid var(--rule);padding-bottom:2.5mm;">Photographs</div>
    <div style="flex:1;width:100%;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:6mm;">
      <sc-for list="{{ extraPhotos }}" as="p" hint-placeholder-count="4">
        <div style="width:{{ tileWidthMm }}mm;aspect-ratio:3/4;position:relative;">
          <svg viewBox="0 0 10 10" style="position:absolute;top:-1.5mm;left:-1.5mm;width:4mm;height:4mm;"><path d="M0 4 L0 0 L4 0" fill="none" stroke="{{ colors.slate }}" stroke-width="0.9"/></svg>
          <svg viewBox="0 0 10 10" style="position:absolute;bottom:-1.5mm;right:-1.5mm;width:4mm;height:4mm;"><path d="M10 6 L10 10 L6 10" fill="none" stroke="{{ colors.slate }}" stroke-width="0.9"/></svg>
          <image-slot id="{{ p.id }}" shape="rect" placeholder="Photo" style="width:100%;height:100%;"></image-slot>
        </div>
      </sc-for>
    </div>
  </div>
</section>
</sc-if>
</doc-page>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: {&quot;width&quot;: 794, &quot;height&quot;: 1123},
  &quot;showPhoto&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Content&quot;},
  &quot;photoCount&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 1, &quot;min&quot;: 1, &quot;max&quot;: 5, &quot;step&quot;: 1, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Content&quot;},
  &quot;density&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;full&quot;, &quot;options&quot;: [&quot;full&quot;, &quot;minimal&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Content&quot;},
  &quot;invocation&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Marriage biodata, prepared for family review&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Content&quot;}
}">
class Component extends DCLogic {
  data = [
    {title:'Personal Details', fields:[
      {l:'Date of Birth', v:'14 June 1996', e:true},
      {l:'Time of Birth', v:'06:45 AM', e:false},
      {l:'Place of Birth', v:'Coimbatore, Tamil Nadu', e:false},
      {l:'Weight', v:'58 kg', e:false},
      {l:'Complexion', v:'Fair', e:false},
      {l:'Blood Group', v:'B+', e:false},
      {l:'Marital Status', v:'Never Married', e:false},
      {l:'Diet', v:'Vegetarian', e:false},
      {l:'Habits', v:'Non-smoker, non-drinker', e:false},
      {l:'Languages Known', v:'Tamil, English, Hindi', e:false},
      {l:'Hobbies', v:'Classical dance, reading, gardening', e:false},
    ]},
    {title:'Religious & Astrological', fields:[
      {l:'Caste', v:'Iyer', e:false},
      {l:'Gotra', v:'Bharadwaja', e:false},
      {l:'Rashi (Moon Sign)', v:'Kanya (Virgo)', e:false},
      {l:'Nakshatra', v:'Chitra', e:false},
      {l:'Manglik Status', v:'Non-Manglik', e:false},
    ]},
    {title:'Education & Career', fields:[
      {l:'College / University', v:'IIT Madras', e:false},
      {l:'Occupation', v:'Software Engineer', e:true},
      {l:'Company', v:'Infosys Ltd., Bengaluru', e:false},
      {l:'Annual Income', v:'\u20b918,00,000 per annum', e:false},
    ]},
    {title:'Family Details', fields:[
      {l:"Father's Name", v:'Mr. R. Raghunathan', e:false},
      {l:"Father's Occupation", v:'Retired Bank Manager', e:false},
      {l:"Mother's Name", v:'Mrs. Kavitha Raghunathan', e:false},
      {l:"Mother's Occupation", v:'Homemaker', e:false},
      {l:'Siblings', v:'One elder brother (married), one younger sister (unmarried)', e:false},
      {l:'Family Type', v:'Nuclear Family', e:false},
      {l:'Native Place', v:'Thanjavur, Tamil Nadu', e:false},
    ]},
    {title:'Contact', fields:[
      {l:'Address', v:'12 Gandhi Street, R.S. Puram, Coimbatore 641002', e:false},
      {l:'Phone', v:'+91 98765 43210', e:false},
      {l:'Email', v:'ananya.r@example.com', e:false},
      {l:'Contact Person', v:'Mr. R. Raghunathan (Father)', e:false},
    ]},
  ];
  quickFactsAll = [
    {l:'Height', v:'5 ft 5 in', e:true},
    {l:'Religion', v:'Hindu', e:true},
    {l:'Based in', v:'Bengaluru', e:true},
    {l:'Phone', v:'+91 98765 43210', e:true},
  ];

  renderVals() {
    const density = this.props.density ?? 'full';
    const showPhoto = this.props.showPhoto ?? true;
    const invocation = this.props.invocation ?? 'Marriage biodata, prepared for family review';
    const sections = this.data
      .map(s => ({ title: s.title, fields: s.fields.filter(f => density === 'full' || f.e) }))
      .filter(s => s.fields.length > 0);
    const quickFacts = this.quickFactsAll.filter(f => density === 'full' || f.e);
    const photoCount = Math.max(1, Math.min(5, this.props.photoCount ?? 1));
    const extraPhotos = Array.from({length: photoCount - 1}, (_, i) => ({id: 'tb-extra-' + i}));
    const tileWidthMm = {1:100, 2:80, 3:55, 4:80}[extraPhotos.length] || 80;
    return { sections, quickFacts, showPhoto, invocation, extraPhotos, hasExtraPhotos: extraPhotos.length > 0, tileWidthMm, name: 'Ananya Raghunathan', colors: { slate: '#3B5169' } };
  }
}
</script>
</body>
</html>
