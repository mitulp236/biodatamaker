<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=EB+Garamond:wght@400;500;600&display=swap">
  <style id="__om-edit-overrides"></style>
  <script src="./doc-page.js"></script>
  <script src="./image-slot.js"></script>
</helmet>
<style>doc-page:not(:defined){visibility:hidden}</style>
<doc-page width="210mm" height="297mm">
<section class="page" style="--maroon:#7B1E28;--gold:#C8A25A;--ivory:#FBF6EC;--ink:#241512;--hairline:#C8A25A;">
  <div style="position:relative;width:100%;height:100%;padding:14mm;box-sizing:border-box;background:var(--ivory);font-family:'EB Garamond',serif;color:var(--ink);">
    <div style="position:relative;width:100%;height:100%;border:2pt solid var(--maroon);padding:3mm;box-sizing:border-box;">
      <div style="position:relative;width:100%;height:100%;border:1pt solid var(--gold);padding:6mm 9mm;box-sizing:border-box;display:flex;flex-direction:column;gap:4mm;overflow:hidden;">

        <div style="position:absolute;top:2mm;left:2mm;width:13mm;height:13mm;">
          <svg viewBox="0 0 60 60" style="width:100%;height:100%;"><path d="M2 40 A38 38 0 0 1 40 2" fill="none" stroke="{{ colors.gold }}" stroke-width="1.6"/><path d="M2 28 A26 26 0 0 1 28 2" fill="none" stroke="{{ colors.maroon }}" stroke-width="1"/><rect x="8" y="8" width="6" height="6" transform="rotate(45 11 11)" fill="{{ colors.maroon }}"/><circle cx="24" cy="6" r="1.8" fill="{{ colors.gold }}"/><circle cx="6" cy="24" r="1.8" fill="{{ colors.gold }}"/></svg>
        </div>
        <div style="position:absolute;top:2mm;right:2mm;width:13mm;height:13mm;transform:scaleX(-1);">
          <svg viewBox="0 0 60 60" style="width:100%;height:100%;"><path d="M2 40 A38 38 0 0 1 40 2" fill="none" stroke="{{ colors.gold }}" stroke-width="1.6"/><path d="M2 28 A26 26 0 0 1 28 2" fill="none" stroke="{{ colors.maroon }}" stroke-width="1"/><rect x="8" y="8" width="6" height="6" transform="rotate(45 11 11)" fill="{{ colors.maroon }}"/><circle cx="24" cy="6" r="1.8" fill="{{ colors.gold }}"/><circle cx="6" cy="24" r="1.8" fill="{{ colors.gold }}"/></svg>
        </div>
        <div style="position:absolute;bottom:2mm;left:2mm;width:13mm;height:13mm;transform:scaleY(-1);">
          <svg viewBox="0 0 60 60" style="width:100%;height:100%;"><path d="M2 40 A38 38 0 0 1 40 2" fill="none" stroke="{{ colors.gold }}" stroke-width="1.6"/><path d="M2 28 A26 26 0 0 1 28 2" fill="none" stroke="{{ colors.maroon }}" stroke-width="1"/><rect x="8" y="8" width="6" height="6" transform="rotate(45 11 11)" fill="{{ colors.maroon }}"/><circle cx="24" cy="6" r="1.8" fill="{{ colors.gold }}"/><circle cx="6" cy="24" r="1.8" fill="{{ colors.gold }}"/></svg>
        </div>
        <div style="position:absolute;bottom:2mm;right:2mm;width:13mm;height:13mm;transform:scale(-1,-1);">
          <svg viewBox="0 0 60 60" style="width:100%;height:100%;"><path d="M2 40 A38 38 0 0 1 40 2" fill="none" stroke="{{ colors.gold }}" stroke-width="1.6"/><path d="M2 28 A26 26 0 0 1 28 2" fill="none" stroke="{{ colors.maroon }}" stroke-width="1"/><rect x="8" y="8" width="6" height="6" transform="rotate(45 11 11)" fill="{{ colors.maroon }}"/><circle cx="24" cy="6" r="1.8" fill="{{ colors.gold }}"/><circle cx="6" cy="24" r="1.8" fill="{{ colors.gold }}"/></svg>
        </div>

        <sc-if value="{{ invocation }}" hint-placeholder-val="{{ true }}">
          <div style="text-align:center;font-family:'Cormorant Garamond',serif;font-size:12pt;letter-spacing:0.08em;color:var(--maroon);font-style:italic;">{{ invocation }}</div>
        </sc-if>

        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:7mm;padding-bottom:3mm;border-bottom:1pt solid var(--gold);">
          <div style="flex:1;min-width:0;">
            <div style="font-family:'Cormorant Garamond',serif;font-size:29pt;font-weight:700;color:var(--maroon);letter-spacing:0.01em;line-height:1.15;">{{ name }}</div>
          </div>
          <sc-if value="{{ showPhoto }}" hint-placeholder-val="{{ true }}">
            <div style="flex:none;width:32mm;height:42.6mm;padding:1.3mm;border:1.4pt solid var(--gold);box-sizing:border-box;">
              <div style="width:100%;height:100%;padding:1mm;border:0.75pt solid var(--maroon);box-sizing:border-box;">
                <image-slot id="t1-photo" shape="rect" placeholder="Portrait photo, 3:4" style="width:100%;height:100%;"></image-slot>
              </div>
            </div>
          </sc-if>
        </div>

        <div style="flex:1;display:flex;flex-direction:column;gap:3.5mm;overflow:hidden;">
          <sc-for list="{{ sections }}" as="section" hint-placeholder-count="5">
            <div style="break-inside:avoid;">
              <div style="font-family:'Cormorant Garamond',serif;font-size:11.5pt;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--maroon);padding-bottom:1.3mm;border-bottom:0.75pt solid var(--gold);">{{ section.title }}</div>
              <div style="display:grid;grid-template-columns:max-content 1fr max-content 1fr;column-gap:5mm;row-gap:1.6mm;padding-top:2mm;">
                <sc-for list="{{ section.fields }}" as="f" hint-placeholder-count="4">
                  <div style="font-size:10pt;font-weight:600;color:var(--ink);white-space:nowrap;">{{ f.l }}</div>
                  <div style="font-size:10pt;color:var(--ink);">{{ f.v }}</div>
                </sc-for>
              </div>
            </div>
          </sc-for>
        </div>

        <div style="text-align:center;font-size:8.5pt;font-style:italic;color:var(--gold);border-top:0.5pt solid var(--gold);padding-top:2mm;">Prepared with care, on the occasion of a new beginning</div>
      </div>
    </div>
  </div>
</section>
<sc-if value="{{ hasExtraPhotos }}" hint-placeholder-val="{{ false }}">
<section class="page" style="--maroon:#7B1E28;--gold:#C8A25A;--ivory:#FBF6EC;">
  <div style="position:relative;width:100%;height:100%;padding:14mm;box-sizing:border-box;background:var(--ivory);font-family:'EB Garamond',serif;">
    <div style="position:relative;width:100%;height:100%;border:2pt solid var(--maroon);padding:3mm;box-sizing:border-box;">
      <div style="position:relative;width:100%;height:100%;border:1pt solid var(--gold);padding:10mm;box-sizing:border-box;display:flex;flex-direction:column;gap:6mm;align-items:center;">
        <div style="font-family:'Cormorant Garamond',serif;font-size:16pt;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--maroon);border-bottom:0.75pt solid var(--gold);padding-bottom:2.5mm;">Photographs</div>
        <div style="flex:1;width:100%;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:6mm;">
          <sc-for list="{{ extraPhotos }}" as="p" hint-placeholder-count="4">
            <div style="width:{{ tileWidthMm }}mm;aspect-ratio:3/4;padding:1.3mm;border:1.2pt solid var(--gold);box-sizing:border-box;">
              <div style="width:100%;height:100%;padding:1mm;border:0.6pt solid var(--maroon);box-sizing:border-box;">
                <image-slot id="{{ p.id }}" shape="rect" placeholder="Photo" style="width:100%;height:100%;"></image-slot>
              </div>
            </div>
          </sc-for>
        </div>
      </div>
    </div>
  </div>
</section>
</sc-if>
</doc-page>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: {&quot;width&quot;: 794, &quot;height&quot;: 1123},
  &quot;showPhoto&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Content&quot;},
  &quot;photoCount&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 1, &quot;min&quot;: 1, &quot;max&quot;: 5, &quot;step&quot;: 1, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Content&quot;},
  &quot;density&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;full&quot;, &quot;options&quot;: [&quot;full&quot;, &quot;minimal&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Content&quot;},
  &quot;invocation&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;|| Shree Ganeshaya Namah ||&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Content&quot;}
}">
class Component extends DCLogic {
  data = [
    {title:'Personal Details', fields:[
      {l:'Full Name', v:'Ananya Raghunathan', e:true},
      {l:'Date of Birth', v:'14 June 1996', e:true},
      {l:'Time of Birth', v:'06:45 AM', e:false},
      {l:'Place of Birth', v:'Coimbatore, Tamil Nadu', e:false},
      {l:'Height', v:'5 ft 5 in (165 cm)', e:true},
      {l:'Weight', v:'58 kg', e:false},
      {l:'Complexion', v:'Fair', e:false},
      {l:'Blood Group', v:'B+', e:false},
      {l:'Marital Status', v:'Never Married', e:false},
      {l:'Diet', v:'Vegetarian', e:false},
      {l:'Habits', v:'Non-smoker, non-drinker', e:false},
      {l:'Languages Known', v:'Tamil, English, Hindi', e:false},
      {l:'Hobbies', v:'Classical dance, reading, gardening', e:false},
    ]},
    {title:'Religious & Astrological', fields:[
      {l:'Religion', v:'Hindu', e:true},
      {l:'Caste', v:'Iyer', e:false},
      {l:'Gotra', v:'Bharadwaja', e:false},
      {l:'Rashi (Moon Sign)', v:'Kanya (Virgo)', e:false},
      {l:'Nakshatra', v:'Chitra', e:false},
      {l:'Manglik Status', v:'Non-Manglik', e:false},
    ]},
    {title:'Education & Career', fields:[
      {l:'Highest Qualification', v:'M.Tech, Computer Science', e:true},
      {l:'College / University', v:'IIT Madras', e:false},
      {l:'Occupation', v:'Software Engineer', e:true},
      {l:'Company', v:'Infosys Ltd., Bengaluru', e:false},
      {l:'Annual Income', v:'\u20b918,00,000 per annum', e:false},
      {l:'Work Location', v:'Bengaluru, Karnataka', e:true},
    ]},
    {title:'Family Details', fields:[
      {l:"Father's Name", v:'Mr. R. Raghunathan', e:false},
      {l:"Father's Occupation", v:'Retired Bank Manager', e:false},
      {l:"Mother's Name", v:'Mrs. Kavitha Raghunathan', e:false},
      {l:"Mother's Occupation", v:'Homemaker', e:false},
      {l:'Siblings', v:'One elder brother (married), one younger sister (unmarried)', e:false},
      {l:'Family Type', v:'Nuclear Family', e:false},
      {l:'Native Place', v:'Thanjavur, Tamil Nadu', e:false},
    ]},
    {title:'Contact', fields:[
      {l:'Address', v:'12 Gandhi Street, R.S. Puram, Coimbatore 641002', e:false},
      {l:'Phone', v:'+91 98765 43210', e:true},
      {l:'Email', v:'ananya.r@example.com', e:false},
      {l:'Contact Person', v:'Mr. R. Raghunathan (Father)', e:false},
    ]},
  ];

  renderVals() {
    const density = this.props.density ?? 'full';
    const showPhoto = this.props.showPhoto ?? true;
    const invocation = this.props.invocation ?? '|| Shree Ganeshaya Namah ||';
    const sections = this.data
      .map(s => ({ title: s.title, fields: s.fields.filter(f => density === 'full' || f.e) }))
      .filter(s => s.fields.length > 0);
    const photoCount = Math.max(1, Math.min(5, this.props.photoCount ?? 1));
    const extraPhotos = Array.from({length: photoCount - 1}, (_, i) => ({id: 't1-extra-' + i}));
    const tileWidthMm = {1:100, 2:80, 3:55, 4:80}[extraPhotos.length] || 80;
    return {
      sections, showPhoto, invocation,
      extraPhotos, hasExtraPhotos: extraPhotos.length > 0, tileWidthMm,
      name: 'Ananya Raghunathan',
      colors: { maroon: '#7B1E28', gold: '#C8A25A' },
    };
  }
}
</script>
</body>
</html>
